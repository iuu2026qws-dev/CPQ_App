# CPQ App 前端 Nginx — 双端口双应用
#   Port 80    → cpq-portal（业务前端）
#   Port 5173  → ruoyi-ui（管理后台）

# ── cpq-portal（业务前端，端口 80）────
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/portal;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/json text/css image/svg+xml;
    gzip_vary on;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://cpq-backend:30000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "OK";
    }
}

# ── ruoyi-ui（管理后台，端口 5173）────
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html/admin;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/json text/css image/svg+xml;
    gzip_vary on;

    location /dev-api/ {
        proxy_pass http://cpq-backend:30000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
