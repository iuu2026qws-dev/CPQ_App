name: CPQ App Build JAR

on:
  push:
    branches: [v4-deploy, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build JAR
        run: mvn package -DskipTests -B -q 2>&1 | tail -10
      - name: Find and upload JAR
        run: |
          JAR=$(find . -name "ruoyi-admin.jar" -path "*/target/*" -type f | head -1)
          echo "Found: $JAR"
          cp "$JAR" ./cpq-app.jar
          ls -lh ./cpq-app.jar
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cpq-app-jar
          path: cpq-app.jar
          retention-days: 30
