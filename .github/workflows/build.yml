name: CPQ App Build JAR

on:
  push:
    branches: [v4-deploy, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Build JAR
        run: mvn clean package -pl "ruoyi-admin 2" -am -DskipTests 2>&1 | grep -E "BUILD|ERROR|ruoyi-admin" | head -10
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cpq-app-jar
          path: "ruoyi-admin 2/target/ruoyi-admin.jar"
          if-no-files-found: error
          retention-days: 30
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cpq-app-jar
          path: "**/target/ruoyi-admin.jar"
          if-no-files-found: error
          retention-days: 30
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cpq-app-jar
          path: cpq-app.jar
          retention-days: 30
