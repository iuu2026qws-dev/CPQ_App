name: CPQ App Build JAR

on:
  push:
    branches: [v4-deploy, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build modules
        run: |
          mvn install -pl "ruoyi-modules" -DskipTests -q
          mvn package -pl "ruoyi-admin 2" -am -DskipTests -q
        shell: bash
      - name: Find and upload JAR
        run: |
          ls -la "ruoyi-admin 2/target/"
          cp "ruoyi-admin 2/target/ruoyi-admin.jar" ./cpq-app.jar 2>/dev/null || cp "ruoyi-admin 2/target/ruoyi-vue-plus.jar" ./cpq-app.jar
          ls -lh ./cpq-app.jar
        shell: bash
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cpq-app-jar
          path: cpq-app.jar
          retention-days: 30
