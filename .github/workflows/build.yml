name: CPQ App Build

on:
  push:
    branches: [v4-deploy, main]
  workflow_dispatch:

jobs:
  # ── Job 1: Java 后端 JAR ──
  build-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Rename directories with spaces
        run: mv "ruoyi-admin 2" ruoyi-admin && mv "ruoyi-common 2" ruoyi-common && sed -i 's/ruoyi-admin 2/ruoyi-admin/g;s/ruoyi-common 2/ruoyi-common/g' pom.xml ruoyi-modules/pom.xml 2>/dev/null
      - name: Build JAR
        run: mvn clean package -DskipTests --no-transfer-progress 2>&1 | tail -50
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cpq-app-jar
          path: ruoyi-admin/target/ruoyi-admin.jar
          if-no-files-found: error
          retention-days: 30

  # ── Job 2: 前端 Docker 镜像（cpq-portal nginx 生产构建）──
  docker-frontend:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image（双前端：cpq-portal + ruoyi-ui）
        run: docker build -f Dockerfile.frontend -t cpq-frontend:latest .
      - name: Export image
        run: docker save cpq-frontend:latest | gzip > cpq-frontend.tar.gz
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: cpq-frontend-image
          path: cpq-frontend.tar.gz
          retention-days: 30
