name: CPQ App Build JAR

on:
  push:
    branches: [v4-deploy, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }
      - name: Build JAR
        run: mvn clean package -DskipTests -q
      - name: Copy JAR
        run: cp "./ruoyi-admin 2/target/ruoyi-admin.jar" /tmp/cpq-app.jar && ls -lh /tmp/cpq-app.jar
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cpq-app-jar
          path: /tmp/cpq-app.jar
          if-no-files-found: error
          retention-days: 30
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cpq-app-jar
          path: "**/target/ruoyi-admin.jar"
          if-no-files-found: error
          retention-days: 30
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: cpq-app-jar
          path: cpq-app.jar
          retention-days: 30

  docker-frontend:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image（双前端：cpq-portal + ruoyi-ui）
        run: docker build -f Dockerfile.frontend -t cpq-frontend:latest .
      - name: Export image
        run: docker save cpq-frontend:latest | gzip > cpq-frontend.tar.gz
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: cpq-frontend-image
          path: cpq-frontend.tar.gz
          retention-days: 30
