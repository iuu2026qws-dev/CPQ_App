name: CPQ CI/CD Pipeline

on:
  push:
    branches: [5.X, main]
  pull_request:
    branches: [5.X]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'registry.example.com' }}

jobs:
  # ========== 后端编译 & 测试 ==========
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Maven Build & Test
        run: mvn clean package -DskipTests=false --batch-mode

      - name: Archive JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruoyi-admin-jar
          path: ruoyi-admin 2/target/ruoyi-admin.jar
          retention-days: 7

  # ========== 前端编译 & 测试 ==========
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: cpq-portal/package-lock.json

      - name: Install & Build
        run: |
          cd cpq-portal
          npm ci
          npm run build

      - name: TypeScript Check
        run: |
          cd cpq-portal
          npx vue-tsc --noEmit

      - name: Archive Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpq-portal-dist
          path: cpq-portal/dist/
          retention-days: 7

  # ========== Docker 镜像构建 & 推送 ==========
  docker-build:
    name: Docker Build & Push
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/5.X' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download Backend JAR
        uses: actions/download-artifact@v4
        with:
          name: ruoyi-admin-jar
          path: ruoyi-admin 2/target/

      - name: Download Frontend Dist
        uses: actions/download-artifact@v4
        with:
          name: cpq-portal-dist
          path: cpq-portal/dist/

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ruoyi-admin 2/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/cpq-backend:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/cpq-backend:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: cpq-portal/
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/cpq-portal:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/cpq-portal:latest

  # ========== 部署通知 ==========
  deploy-notification:
    name: Notify Deploy
    needs: [docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/5.X'
    steps:
      - name: Webhook Deploy
        run: |
          echo "Images pushed:"
          echo "  ${{ env.DOCKER_REGISTRY }}/cpq-backend:${{ github.sha }}"
          echo "  ${{ env.DOCKER_REGISTRY }}/cpq-portal:${{ github.sha }}"
          # curl -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }} -d '{"images": ...}'
