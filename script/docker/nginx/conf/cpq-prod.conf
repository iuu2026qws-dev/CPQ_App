# Nginx 生产配置 — CPQ + RuoYi 同域 SSO（S18.7 S21.2）
# 放置路径：/etc/nginx/conf.d/cpq.conf

upstream cpq_backend {
    server 127.0.0.1:8080 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream cpq_frontend {
    server 127.0.0.1:5173 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream ruoyi_admin_frontend {
    server 127.0.0.1:3000 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 80;
    server_name cpq.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cpq.example.com;

    # SSL 证书
    ssl_certificate     /etc/nginx/ssl/cpq.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/cpq.example.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 日志
    access_log /var/log/nginx/cpq_access.log;
    error_log  /var/log/nginx/cpq_error.log;

    # 静态资源缓存
    location /assets/ {
        proxy_pass http://cpq_frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # RuoYi 管理后台（ruoyi-ui）
    location /admin {
        proxy_pass http://ruoyi_admin_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://cpq_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # API 限流（基于客户端 IP）
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
    }

    # Swagger / Knife4j 文档
    location /swagger-ui/ {
        proxy_pass http://cpq_backend/swagger-ui/;
    }
    location /doc.html {
        proxy_pass http://cpq_backend/doc.html;
    }
    location /v3/api-docs {
        proxy_pass http://cpq_backend/v3/api-docs;
    }

    # CPQ 前端 SPA
    location / {
        proxy_pass http://cpq_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "OK";
    }
}

# 限流区域定义（全局）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# Gzip 压缩
gzip on;
gzip_min_length 1k;
gzip_comp_level 6;
gzip_types text/plain application/javascript application/json text/css image/svg+xml;
gzip_vary on;
gzip_proxied any;
